[project]
name = "qr_generator"
version = "2.1.19"
description = "This integration allows to create QR Codes with static or dynamic content."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "DeerMaximum", email = "git983456@parabelmail.de" },
]
maintainers = [
    { name = "DeerMaximum", email = "git983456@parabelmail.de" },
]
requires-python = ">=3.14.2"
keywords = [
    "homeassistant",
    "qr",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "pyqrcode==1.2.1",
    "pypng==0.20220715.0"
]

[project.urls]
homepage = "https://github.com/DeerMaximum/QR-Code-Generator"
repository = "https://github.com/DeerMaximum/QR-Code-Generator"

[dependency-groups]
dev = [
    "aiohttp_cors",
    "homeassistant==2026.10.0b0",
    "pytest-homeassistant-custom-component",
    #Fix UnserializableField exception
    "mashumaro>=3.22",
]
lint = [
    "ruff>=0.16.0"
]

[tool.ruff]
preview = true

[tool.ruff.lint]
ignore = ["EXE002"]

[tool.ruff.lint.isort]
case-sensitive = true

[tool.uv]
default-groups = "all"
