version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: daily
    groups:
      home-assistant:
        applies-to: version-updates
        patterns:
          - "homeassistant"
          - "pytest-homeassistant"
      home-assistant-security:
        applies-to: security-updates
        patterns:
          - "homeassistant"
          - "pytest-homeassistant"